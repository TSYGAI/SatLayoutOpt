# 前端单元测试入口的报告归档设置；与应用运行日志分开保存。
[testing.frontend]
# 相对于项目根目录，每次运行创建独立子目录；必须位于 test-results/unit/frontend 内。
unit_output_dir = "test-results/unit/frontend"

# 迁移基准只供 tests/ 中的隔离工具使用，不改变生产求解配置。
[testing.migration_baseline]
# 性能记录和隔离输入所在目录；每次运行创建独立子目录。
output_dir = "test-results/performance/migration-stage-1"
# 进程树和系统资源采样间隔，单位秒。
sample_interval_seconds = 0.2
# 单个真实模型或布局样本的最长观测时间，单位秒；超时必须记为未完成。
case_timeout_seconds = 900
# 相同真实布局输入的独立重复运行次数。
layout_repeats = 2
# 基准每轮试次上限；仅在隔离进程内覆盖，不修改正式每轮 10000 次预算。
layout_attempts_per_round = 32
# 从按文件体积排序的真实上传模型中选取最小、中位、最大三个分位点。
model_size_quantiles = [0.0, 0.5, 1.0]
# 浏览器等待真实预览或后台任务的最长时间，单位毫秒。
browser_timeout_ms = 180000
# 旋转交互时连续采集的 requestAnimationFrame 间隔数量；不等同于 GPU 渲染帧率。
browser_frame_samples = 120

# 第三阶段计算协议与多进程原型的隔离验收参数，不修改生产求解预算。
[testing.compute_engine]
# 相同数值快照参与对照的进程数量，1 表示独立引擎内串行执行。
worker_counts = [1, 4, 6]
# 原始小预算结果对照，以及用于观察并行收益的固定试次预算。
attempt_budgets = [32, 256]
# 各进程数、各预算独立重复次数。
repeats = 2
# 单次进程协议验收与性能测试超时，单位秒。
timeout_seconds = 600
# 整棵计算进程树 CPU 与内存采样间隔，单位秒。
sample_interval_seconds = 0.1

# 第五阶段正式 HTTP 调度链的隔离基准；不改变正式每轮尝试上限。
[testing.rust_scheduler]
# 固定每轮预算，用于比较串行、四、五、六进程的真实业务结果。
attempt_budget = 256
# 每组启动独立 Rust 服务并执行冷缓存、热缓存两个任务。
worker_counts = [1, 4, 5, 6]
# 每种进程数重复任务次数，至少两次以验证准备缓存命中。
repeats = 2
# 额外多进程持续求解预算，用于检查长任务的取消、响应及内存变化。
long_attempt_budget = 2048
# 单次业务任务的验收超时，单位秒，仅限隔离基准工具。
timeout_seconds = 600
# HTTP 状态和进程树采样间隔，单位秒。
sample_interval_seconds = 0.1

# 固定约束真实接口和浏览器回归的本机环境设置。
[testing.fixed_constraints]
# 浏览器回归使用的 Chromium 系浏览器可执行文件；其他机器需调整该路径。
browser_executable = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"

# 包络分批真实模型验收；输入只读，所有输出位于 test-results。
[testing.envelope_batching]
# 独立射线验收的每批探针上限；不改变探针总数，内存不足时验证器自动缩小批次。
verification_batch_size = 128
# 桌面端当前上传列表，包含本次验收的八个真实模型。
model_root = "data/desktop/tauri/data/uploads/models"
# 真实模型的源网格缓存，只在源指纹、姿态和离散公差一致时复用。
artifact_root = "data/desktop/tauri/data/processed/models"
# 覆盖历史 384、当前默认 500 和 1000 分辨率，保留已有性能验收档位。
resolutions = [384, 500, 1000]
# 左、右、前、后、上、下六个方向的互异增量，单位毫米。
distinct_clearances_mm = [7, 19, 31, 43, 59, 73]
# 单个真实场景的最长验收时间，单位秒；超时记为失败，不视为生成成功。
case_timeout_seconds = 7200
# 进程私有内存采样周期，单位秒。
sample_interval_seconds = 0.1

# 独立计算引擎的协议与进程限制；布局生产调度由 Rust 根据资源快照选择 workers。
[compute_engine]
# JSON 控制请求最大字节数；几何数组必须通过二进制资源交接。
request_max_bytes = 8388608
# 单条进度或终态协议消息最大字节数，避免把大型数组塞入标准输出。
event_max_bytes = 1048576
# 独立引擎允许启动的数值计算工作进程上限，正式任务另受 Rust 资源预算约束。
max_workers = 6
# 每个数值工作进程的 BLAS/OpenMP 线程数，防止进程与线程层叠争用。
numeric_threads_per_worker = 1
# 在途与待归并结果总数上限为进程数乘此值，允许短试次补位；实际派发仍受每轮预算约束。
prefetch_per_worker = 2
# 等待子任务结果时检查取消的间隔，单位秒。
poll_interval_seconds = 0.1
# 客户端请求取消后的退出宽限期，超过后回收计算进程树，单位秒。
cancel_grace_seconds = 8.0
# 人工微调复用一个隔离数值进程，避免每次校核重复启动和导入；不复用任务或校核结果。
refinement_worker_enabled = true
# 微调计算进程空闲多久后自动回收，单位秒；后续请求按需重新创建。
refinement_worker_idle_seconds = 60.0
# 微调常驻进程读取控制管道的检查间隔，单位秒；兼顾输入响应和空闲 CPU 开销。
refinement_worker_poll_seconds = 0.01
# 正式数值工作池采样内存并调整派发的间隔，单位秒。
resource_sample_seconds = 0.5
# 实测工作进程峰值乘此安全系数后用于下一次派发估算。
memory_estimate_margin = 1.25
# 每个数值进程的安装姿态缓存上限，单位字节；超出后按最近使用顺序淘汰。
mount_cache_bytes = 33554432

# 包络进度只随实际阶段和工作批次前进；100% 保留给 Rust 校验并发布成功的终态。
[envelope_progress]
# 计算进度事件的有界缓冲数量，避免阻塞几何计算和宿主取消处理。
event_capacity = 64

# 各阶段在单模型进度中的起止百分比；表示工作进度权重，不表示预计耗时。
[envelope_progress.ranges]
# 检查同参数包络或源网格缓存。
source_loading = [1, 5]
# 完整 STEP 三角离散。
step_tessellation = [5, 20]
# 单位、比例、模型坐标和初始姿态归一化。
source_normalization = [20, 23]
# 检查六向增量和精细化参数。
parameter_validation = [23, 25]
# 计算网格格距并分配整网格或磁盘分批工作空间。
grid_planning = [25, 27]
# 按源三角面批次或磁盘网格分片保守栅格化。
surface_rasterization = [27, 60]
# 封连细缝并按全局连通关系填充内部空间。
exterior_fill = [60, 72]
# 按六向增量扫掠占据区域。
directional_sweep = [72, 82]
# 重建、简化、融合并校验正式包络表面。
surface_extraction = [82, 93]
# 保存源网格缓存和正式产物清单。
artifact_write = [93, 98]

# Rust/Tauri 运行日志；正常简洁，慢、停滞和失败时展开步骤与对象。
[logging]
# 相对于项目根目录（安装版为程序目录）的统一日志根目录；按启动日期、前后端及每日会话编号组织。
root_dir = "logs"
# 单文件写入队列上限；满时计数告警，不阻塞业务线程。
queue_capacity = 2048
# 每个操作保留的最近步骤数量，异常时展开。
recent_capacity = 32
# 单字段最多字符数，超出明确标记截断。
field_max_chars = 8192
# 程序异常仅保留最近的有效调用位置数量，省略完整路径和监测包装调用。
stack_frame_limit = 4
# 宿主独立监测间隔，单位毫秒。
watchdog_interval_ms = 1000
# 普通请求及前端操作耗时预警阈值，单位毫秒；统一为 5 分钟。
slow_request_ms = 300000
# 文件、解码、模型校验等内部步骤耗时预警阈值，单位毫秒；统一为 5 分钟。
slow_step_ms = 300000
# CAD、求解等长计算耗时预警阈值，单位毫秒；统一为 5 分钟。
slow_compute_ms = 300000
# 同一执行者连续 5 分钟无实际进展才提示疑似停滞，单位毫秒；不代表已确认死锁。
stalled_ms = 300000
# 同一慢步骤重复提醒最短间隔，单位毫秒。
repeat_ms = 60000
# 桌面遥测请求体上限，单位字节。
telemetry_max_bytes = 262144
# 单批桌面遥测事件数上限。
telemetry_batch_size = 64
# 桌面遥测批量发送间隔，单位毫秒；阶段开始会立即发送。
frontend_flush_ms = 500

# Rust 业务宿主；与 Python 计算引擎独立构建，共享既有持久化数据格式。
[rust_backend]
# Cargo 构建产物位于项目数据目录，不写入源码。
build_dir = "data/build/rust-backend"
# 计算任务输入副本和暂存输出；发布成功或失败后清理。
staging_dir = "data/processed/compute-tasks"
# 同一数据目录只允许一个 Rust 业务进程写入，进程退出自动释放系统文件锁。
lock_file = "data/processed/rust-backend.lock"
# SQLite 等待现有事务释放锁的最长时间，单位秒。
database_timeout_seconds = 30
# 普通 JSON 请求体上限，避免元数据接口接收大模型数据。
json_max_bytes = 8388608
# 生产包络算法标识；与 Python 计算模块的算法契约保持一致。
envelope_algorithm = "exterior_occupancy_directional_sweep_v9"
# 生产布局任务允许的数值工作进程上限；实际数量还受 CPU、内存和其他活动任务限制。
compute_worker_cap = 6
# 为桌面、HTTP 服务和操作系统保留的逻辑处理器数量。
compute_cpu_reserve = 4
# 为操作系统、桌面和 Rust 服务保留的物理内存，单位为字节。
compute_memory_reserve_bytes = 3319791616
# 每个 Python 数值工作进程的保守私有内存预算，单位为字节；只用于派发上限估算。
compute_worker_memory_bytes = 268435456
# 全软件可控内存的总预算比例；先扣除界面、缓存和显示工作空间，再供全部计算任务共享。
compute_memory_fraction = 0.8
# 计算协调进程或 CAD 进程的基础内存预留，单位字节。
compute_host_memory_bytes = 536870912
# 将输入文件体积放大为数组映射和几何临时空间预算的倍数。
compute_input_memory_factor = 3
# 每个 CAD 进程允许的 OpenCascade 原生线程数，同时计入全局 CPU 槽位。
compute_cad_threads = 6
# 普通进度聚合后写入 SQLite 的最短间隔；候选和终态立即写入，单位秒。
progress_flush_seconds = 0.5
# 可再生成的布局准备缓存目录；缓存包含带摘要的 NPY 和兼容历史 NPZ。
prepared_cache_dir = "data/processed/layout-prepared-cache"
# 准备缓存磁盘总量上限，超限淘汰最久未使用条目，单位字节。
prepared_cache_max_bytes = 2617245696
# 准备算法或验收语义改变时增加此版本；版本 13 增加按高度关联的锥段许可，继承共面区域基准及真实包络接触悬高。
prepared_cache_version = 13
# 最近一次固定预览的正式包络与验收结果；独立于历史任务，缺失时正常重新准备。
fixed_preview_cache_dir = "data/processed/fixed-preview-cache"
# 单槽固定预览缓存最大字节数；超限仍返回正式结果，只跳过缓存。
fixed_preview_cache_max_bytes = 117440512
# 可再生成的布局显示网格缓存，源 NPZ 始终保留在历史目录。
mesh_cache_dir = "data/processed/layout-mesh-cache"
# 显示网格磁盘缓存总容量（字节），按最近访问淘汰。
mesh_cache_max_bytes = 2617245696
# 单型号二进制网格最大字节数；超出时明确报错，避免无界解压与传输。
mesh_max_bytes = 67108864
# 固定约束页正式包络显示二进制的单文件上限，单位字节；超限时前端可按实际内存条件回退旧网格接口。
fixed_display_max_bytes = 603979776

# 硬件设置页按业务阶段分配的 CPU 预算；保存后重启应用统一生效。
[hardware]
# 软件界面与服务基础内存的估计余量，单位字节；缓存与显示工作空间另计，不是操作系统硬限制。
application_memory_overhead_bytes = 268435456
# 所有计算任务合计最多同时运行的进程宿主数；仍受 CPU 和内存准入限制。
max_concurrent_tasks = 4
# 模型上传第一阶段（快速交互预览）每个任务的 CAD 线程上限。
upload_interaction_threads = 4
# 模型上传第二阶段（细节预览）每个任务的 CAD 线程上限。
upload_detail_threads = 2
# 包络生成每个任务的 CAD 线程上限；体素阶段仍按算法自身的分批流程执行。
envelope_threads = 6
# 前置配置的罩体与安装参考 CAD 线程、固定预览与显示资源数值库线程上限。
pre_config_threads = 4
# 数据管理中按需生成包络浏览资源和导出的数值库线程上限；串行写入不会自动并行。
data_management_threads = 2

# 点击按钮时生成三档全软件共享预算；只生成建议，确认并保存后重启生效。
[hardware.recommendation]
# 低、中、高三档的整机资源预算比例，按从低到高排列。
resource_fractions = [0.40, 0.60, 0.80]
# 弹窗默认选中方案，索引从 0 开始；1 表示中档。
default_tier_index = 1
# 从软件 CPU 预算中给界面与服务留出的槽位；小型电脑至少保留一个计算槽位。
application_cpu_slots = 1
# 当前可用内存中额外保留的动态安全余量比例；与三档总预算共同约束，不重复预留其他程序已用内存。
memory_reserve_fraction = 0.10
# 系统预留内存的推荐下限，单位字节。
memory_reserve_min_bytes = 1073741824
# 系统预留内存的推荐上限，单位字节。
memory_reserve_max_bytes = 4294967296
# 推荐每个布局数值进程的线程数；优先让多进程承担并行。
numeric_threads = 1
# 推荐布局工作进程数的上限，还受当前引擎硬上限和 CPU、内存约束。
worker_cap = 8
# 推荐同时运行宿主任务数的上限。
concurrent_tasks_cap = 4
# 推荐准入估计中为模型输入和额外数组保留的余量，单位字节。
task_headroom_bytes = 536870912
# 单个包络进程的目标预算占计算容量的比例；至少容纳宿主、工作空间和输入余量。
envelope_memory_fraction = 0.50
# 推荐单个包络进程内存上限的最大值，单位字节。
envelope_memory_max_bytes = 8589934592

# 缓存和工作空间推荐策略；内存规则按所属预算取比例，限制到 MiB 边界后按 step_mib 向下对齐。
[hardware.recommendation.resources]
# 预览数组缓存占软件总预算的比例，以及最小、最大和递增粒度（MiB）。
preview_cache = { fraction = 0.06, min_mib = 128, max_mib = 4096, step_mib = 64 }
# 最近记录原始预览缓存的比例与 MiB 边界；解码显示另计。
data_cache = { fraction = 0.01, min_mib = 32, max_mib = 512, step_mib = 32 }
# 共享显示几何占软件总预算的比例与 MiB 边界；同步作为前后端单资源上限。
display_geometry = { fraction = 0.025, min_mib = 64, max_mib = 1024, step_mib = 64 }
# 显示网格工作空间占软件总预算的比例与 MiB 边界，推荐值不得小于几何预算。
display_worker = { fraction = 0.05, min_mib = 128, max_mib = 2048, step_mib = 64 }
# 单模型磁盘预览缓存按处理规模估算的比例与 MiB 边界，不表示磁盘可用容量。
preview_disk = { fraction = 0.03, min_mib = 64, max_mib = 2048, step_mib = 64 }
# 固定预览单槽磁盘缓存的比例与 MiB 边界。
fixed_preview_disk = { fraction = 0.005, min_mib = 16, max_mib = 256, step_mib = 16 }
# 共享显示磁盘缓存的比例与 MiB 边界，同时保证可容纳一个资源及格式索引。
display_disk = { fraction = 0.10, min_mib = 256, max_mib = 8192, step_mib = 64 }
# 布局准备磁盘缓存按处理规模估算的比例与 MiB 边界。
prepared_disk = { fraction = 0.10, min_mib = 256, max_mib = 8192, step_mib = 64 }
# 推导后台常驻模型数时的单模型数组容量估计（字节），实际仍按缓存总字节数淘汰。
preview_model_bytes = 268435456
# 推荐后台常驻模型数量上限，不含当前场景。
preview_model_cap = 16
# 包络单批空间占扣除界面和缓存后的计算预算比例，以及 MiB 边界和粒度。
envelope_workspace = { fraction = 0.04, min_mib = 64, max_mib = 1024, step_mib = 64 }
# 体素批次占单批空间的比例；每单元按 16 字节估计，数量限定在 minimum/maximum 并按 step 对齐。
voxel_batch = { fraction = 0.50, bytes_per_item = 16, minimum = 32768, maximum = 67108864, step = 32768 }
# 表面提取分阶段占用空间；每单元按 512 字节估计，边界与粒度单位均为单元。
surface_batch = { fraction = 0.50, bytes_per_item = 512, minimum = 32768, maximum = 1048576, step = 32768 }
# 栅格投影与体素数组共同占用空间；每单元按 160 字节估计，边界与粒度单位均为单元。
raster_batch = { fraction = 0.078125, bytes_per_item = 160, minimum = 1024, maximum = 1048576, step = 1024 }
# 源三角面临时数组的比例；每面保守按 1024 字节估计，边界与粒度单位均为三角面。
triangle_batch = { fraction = 0.015625, bytes_per_item = 1024, minimum = 256, maximum = 16384, step = 256 }

# 各功能按重要程度和实际并行特征申请共享资源；下列比例是单任务需求上限，不是固定分区。
[hardware.scheduling]
# 每等待这些秒增加一次优先级，避免低优先级任务长期饥饿；已运行任务不抢占。
aging_interval_seconds = 30
# 每次等待老化增加的优先级分数；同分按入队先后执行。
aging_priority_step = 10

[hardware.scheduling.interaction]
# 可运行的线程下限；预算不足此值时排队，不强行启动。
minimum_threads = 1
# 单任务最低估计内存，单位字节；实际申请还会按模型输入和工作空间提高。
minimum_memory_bytes = 805306368
# 快速交互预览优先响应用户。
priority = 100
# 单任务可申请计算 CPU 槽位的比例。
cpu_fraction = 0.6
# 快速网格生成建议线程上限。
thread_cap = 4

[hardware.scheduling.pre_config]
# 可运行的线程下限。
minimum_threads = 1
# 单任务最低估计内存，单位字节；大模型自动提高申请量。
minimum_memory_bytes = 805306368
# 前置设置与可见预览优先响应操作。
priority = 90
# 单任务可申请计算 CPU 槽位的比例。
cpu_fraction = 0.5
# 前置处理建议线程上限。
thread_cap = 4

[hardware.scheduling.layout]
# 数值任务最低工作线程数，协调进程另计槽位。
minimum_threads = 1
# 布局协调与工作进程最低合计估计内存，单位字节。
minimum_memory_bytes = 1073741824
# 正式布局求解属于核心重计算。
priority = 80
# 空闲时允许布局工作进程使用全部剩余计算槽位。
cpu_fraction = 1.0
# 布局协调与准备阶段建议线程上限；数值池另受引擎上限约束。
thread_cap = 6

[hardware.scheduling.envelope]
# 包络任务最低线程数。
minimum_threads = 1
# 包络宿主、工作空间及输入余量的最低估计内存，单位字节。
minimum_memory_bytes = 1342177280
# 正式包络生成优先于后台细节与数据处理。
priority = 70
# CAD 阶段需求比例，体素阶段按实际内存分批。
cpu_fraction = 0.8
# 包络 CAD 建议线程上限。
thread_cap = 6

[hardware.scheduling.detail]
# 细节任务最低线程数。
minimum_threads = 1
# 细节任务最低估计内存，单位字节；大模型按输入追加。
minimum_memory_bytes = 805306368
# 细节预览在快速预览与核心计算之后执行。
priority = 40
# 后台细节任务的 CPU 需求比例。
cpu_fraction = 0.35
# 细节处理包含串行步骤，不盲目增加线程。
thread_cap = 3

[hardware.scheduling.data]
# 数据生成与导出最低线程数。
minimum_threads = 1
# 数据任务最低估计内存，单位字节。
minimum_memory_bytes = 671088640
# 数据管理的生成和导出任务优先级。
priority = 30
# 数据处理的 CPU 需求比例。
cpu_fraction = 0.25
# 数据处理建议线程上限。
thread_cap = 2

[hardware.scheduling.other]
# 未分类任务最低线程数。
minimum_threads = 1
# 未分类任务最低估计内存，单位字节。
minimum_memory_bytes = 536870912
# 未分类任务采用保守优先级。
priority = 20
# 未分类任务的 CPU 需求比例。
cpu_fraction = 0.25
# 未分类任务建议线程上限。
thread_cap = 2

[backend]
# 后端 API 监听地址。
host = "127.0.0.1"
# 后端 API 监听端口。
port = 10000
# STEP/STP 原始模型存储目录，相对于项目根目录。
model_storage_dir = "data/uploads/models"
# 双 LOD GLB、公共外壳表与 STEP 面映射派生产物目录，相对于项目根目录。
model_artifact_dir = "data/processed/models"
# 细节预览线性公差占模型最大包围尺寸的比例。
model_preview_detail_linear_ratio = 0.0005
# 细节预览角度公差，单位为度。
model_preview_detail_angular_degrees = 10.0
# 交互预览初始线性公差占模型最大包围尺寸的比例。
model_preview_interaction_linear_ratio = 0.002
# 旧交互流程允许使用的最大线性公差比例；快速模式使用初始公差且不重复降精度。
model_preview_interaction_max_linear_ratio = 0.005
# 交互预览初始角度公差，单位为度。
model_preview_interaction_angular_degrees = 20.0
# 旧交互流程允许使用的最大角度公差，单位为度；快速模式使用初始角度公差。
model_preview_interaction_max_angular_degrees = 30.0
# 旧交互流程目标三角形数量，超出时逐级放宽公差；快速模式不按此值减面。
model_preview_interaction_triangle_target = 250000
# 是否使用原生三维建模引擎并行网格化生成完整交互预览；细节档仍执行保守外壳筛选。
model_preview_interaction_fast_enabled = true
# 外壳可见性快速检查时每面最多使用的采样点数量；删面仍须通过精确实体内含校验。
model_preview_shell_samples_per_face = 9
# 外壳射线起点偏移占模型包围盒对角线的比例。
model_preview_shell_ray_epsilon_ratio = 0.0000001
# 浏览器预览派生产物版本；变更时自动重建双 LOD、外壳表、面映射和 STEP 拓扑边线。
model_preview_artifact_version = 6
# 浏览器合并完成的预览二进制缓存单个文件最大体积，单位为字节；超出时拒绝写入以保护本地磁盘。
model_preview_runtime_cache_max_bytes = 738197504
# 旧模型索引缺少设备名称时的兼容默认值；新上传模型默认使用上传文件名（不含扩展名）。
model_settings_default_device_name = "GPS satellite"
# 模型设置页的默认比例，必须大于 0。
model_settings_default_scale = 1.0
# 模型设置页的默认原始单位，可选 mm、cm 或 m。
model_settings_default_unit = "mm"
# 模型设置页默认绕 X 轴旋转角度，可选 0、90、180 或 270 度。
model_settings_default_rotation_x = 0
# 模型设置页默认绕 Y 轴旋转角度，可选 0、90、180 或 270 度。
model_settings_default_rotation_y = 0
# 模型设置页默认绕 Z 轴旋转角度，可选 0、90、180 或 270 度。
model_settings_default_rotation_z = 0
# 卫星设置页默认向上轴向，可选 +X、-X、+Y、-Y、+Z、-Z 或 free（自由）；沿用旧键名，不改变预览 XYZ 旋转。
model_settings_default_front_orientation = "+Z"
# 包络读取完整 STEP 时的线性离散公差占模型包围盒对角线比例；1/450 与参考包络输入精度一致。
model_envelope_step_linear_ratio = 0.0022222222222222222
# 包络读取完整 STEP 时允许的最小线性离散公差，单位为毫米。
model_envelope_step_min_linear_tolerance_mm = 0.5
# 包络读取完整 STEP 时的角度离散公差，单位为度；0.25 弧度对应此值。
model_envelope_step_angular_degrees = 14.32394487827058
# 新模型及缺少包络设置的历史模型的默认体素分辨率；各模型可独立覆盖，格距为源最长边除以该值。
model_envelope_refinement_grid_size = 500
# 每模型体素分辨率的最小格数；不得低于现有三维算法要求的 32 格。
model_envelope_refinement_grid_min = 32
# 旧投影算法的兼容字段；三维 v9 不使用方向采样，保留字段以兼容既有任务。
model_envelope_refinement_direction_count = 20
# 旧连接核心的兼容字段；三维 v9 不构造凸包核心。
model_envelope_connectivity_core_inset_ratio = 0.12
# 旧投影平滑的兼容字段；三维 v9 使用一格保护层，实际误差写入产物质量统计。
model_envelope_detail_smoothing_ratio = 0.008
# 旧投影简化的兼容字段；三维 v9 不使用此比例。
model_envelope_outline_simplify_ratio = 0.004
# 三维细缝闭运算宽度占源最短边的比例，同时受毫米上限限制；0 关闭封缝。
model_envelope_gap_bridge_ratio = 0.06
# 包络算法版本；修改六向轮廓扩张或局部修正规则时递增，使旧产物自动失效。
model_envelope_artifact_version = 13
# 仅旧 Python 独立调用使用的包络失败诊断目录；Rust 托管计算使用临时快照并汇入当次后端会话日志。
model_envelope_failure_log_dir = "data/logs/envelope"
# 三维包络最多封连的细小缝隙宽度（毫米）；明显可装载凹陷不会按模型总尺寸扩大封缝。
model_envelope_gap_bridge_limit_mm = 3.0
# 单批占据网格的单元上限；按整机 8GB 设置，超出时保持格距并分批融合，不限制总单元数。
model_envelope_voxel_max_cells = 27262976
# 单个表面提取分块的采样单元上限，含保护边；用于限制原生几何库的瞬时内存。
model_envelope_surface_batch_cells = 851968
# 直接 Python 调用的分批临时目录，相对数据根目录；正式 Rust 任务放在 staging_dir 的任务目录内，取消也会回收。
model_envelope_scratch_dir = "data/processed/envelope-workspace"
# 分批计算后必须保留的磁盘可用空间，单位字节；不足时明确报告，不降低分辨率。
model_envelope_scratch_reserve_bytes = 1073741824
# 保守三角面栅格化每次读取的源三角面数量，限制网格索引临时数组。
model_envelope_raster_triangle_batch = 13312
# 每批栅格化允许枚举的二维投影单元数；巨大三角面自动分条处理。
model_envelope_raster_batch_cells = 425984
# 三维精细化单批数组工作空间上限（字节）；实际再受已分配任务预算和可用内存限制。
model_envelope_workspace_memory_bytes = 872415232
# 包络进程私有内存上限（字节）；8GB 基准为 3GB，实际只使用统一调度剩余预算。
model_envelope_process_memory_limit_bytes = 8589934592
# 包络计算必须留给操作系统、桌面和其他程序的物理内存（字节）。
model_envelope_memory_reserve_bytes = 3319791616
# 模型与包络固化存储目录，相对于项目根目录；数据库文件与每个固化记录的二进制资源都在此目录下。
model_store_dir = "data/store"
# 固化存储的 SQLite 数据库文件名，位于 model_store_dir 内。
model_store_database_name = "sat_layout_opt.sqlite3"
# 单个固化记录只允许保存一份 0 度基础包络；布局姿态在求解时通过矩阵旋转。
model_store_max_variants = 1

# 前置配置页配置。
