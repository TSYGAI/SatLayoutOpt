cylinder_radial_segments = 96
# 新打开前置配置页时预填的内部安装筒半径区间两端默认值，单位为毫米。
default_cylinder_radius_mm = 400.0
# 内部安装筒质心最大偏移下限，单位为毫米，必须大于 0。
min_axis_radius_mm = 0.001
# 新打开前置配置页时预填的质心最大偏移，单位为毫米。
default_axis_radius_mm = 80.0
# 整流罩半径下限，单位为毫米，必须大于 0。
min_fairing_shell_radius_mm = 0.001
# 新打开前置配置页时预填的整流罩外部边界半径，单位为毫米，必须大于默认安装筒半径。
default_fairing_shell_radius_mm = 800.0
# 新打开前置配置页时预填的内部安装筒高度区间两端默认值，单位为毫米。
default_cylinder_height_mm = 3600.0
# 安装筒基座预载的下底面半径，单位为毫米；预载时不超过当前罩底半径。
default_installation_base_lower_radius_mm = 600.0
# 安装筒基座预载高度，单位为毫米；筒体高度不包含此值。
default_installation_base_height_mm = 200.0

# A+B 布局优化参数；没有任务总超时，CP 工作量与整个任务的规划试次均有上限。
[layout_optimization]
# 历史项目名称的最大字符数；重命名只改变展示名称，不改原始任务备注。
history_name_max_length = 120
# 新建布局项目的默认名称前缀；仅同前缀加纯数字的现存名称参与续号。
history_default_name_prefix = "未命名项目"
# 默认名称编号的最少位数；不足时补零，超过后自然扩展。
history_default_name_digits = 2
# 优化任务输入、进度与结果的本地持久化目录。
storage_dir = "data/history/layout_optimization"
# 结果区默认展示数量；不限制搜索及服务端候选存档。
candidate_count = 5
# 新任务“展示方案数量”的默认值；按后端评分排名截取，不限制内部搜索候选数量。
candidate_limit = 100
# 服务端候选存档上限，优先保留尺寸 Pareto 前沿和两端折中。
candidate_archive_limit = 100
# A+B 总数值试次预算；仍受每轮上限约束，构造阶段和改善阶段共享。
hybrid_attempt_budget = 256
# 构造阶段在半径网格上均匀覆盖的最大点数，包含最大和最小半径；其余由邻域细化。
hybrid_radius_samples = 12
# 总预算中留给 ALNS 改善的比例。
alns_budget_fraction = 0.4
# 每次指定半径和层数的 CP 分组方案数量默认上限；布局页可按任务调整，构造与 ALNS 修复共用。
cp_partition_limit = 4
# CP-SAT 单次确定性工作量上限，避免墙钟超时造成种子不可复现。
cp_deterministic_time = 0.2
# CP 环向占用量的整数刻度，单位为每弧度刻度数。
cp_angle_scale = 100000
# 低位优先构造每个安装单元的基础环向采样数；另加入已放星角投影边缘作为接触事件。
bottom_up_angle_samples = 16
# 基座静态接触搜索的距离精度，单位毫米；返回安全端点，最终碰撞验收仍使用独立几何容差。
vertical_contact_precision_mm = 0.05
# CP层质量软目标的整数刻度，单位为每千克刻度数；提高小质量差的分辨率。
layer_mass_scale = 1000
# ALNS 每次移除的安装单元比例；硬对称单元整体移除。
alns_destroy_fraction = 0.4
# ALNS 算子奖励的指数更新系数，范围 (0,1]。
alns_reaction = 0.2
# ALNS 新增非支配候选的奖励。
alns_improvement_reward = 6.0
# ALNS 获得合法但被支配候选的奖励。
alns_feasible_reward = 1.0
# ALNS 失败算子的最小奖励，保持探索概率。
alns_failure_reward = 0.1
# 结构去重时安装轴向矩阵保留的小数位数，用于消除坐标变换浮点噪声。
candidate_orientation_decimals = 6
# 展示目标的参考尺度，单位毫米；实际 Pareto 支配使用原始值，软约束不得越级。
objective_tolerance_mm = 1.0
# 指定安装面到舱体安装位置的悬高范围默认最小值，单位为毫米。
min_suspension_mm = 0.0
# 指定安装面到舱体安装位置的悬高范围默认最大值，单位为毫米。
max_suspension_mm = 20.0
# 圆柱半径扫描步长默认值，单位为毫米；布局页可按任务覆盖。
radius_step_mm = 1.0
# 任务试次预算硬上限；A+B 实际取此值与 hybrid_attempt_budget 的较小值，所有策略共享。
max_attempts_per_round = 20000
# 每次连续求解的迭代数；单次未收敛后继续尝试，不作为整个任务的停止条件。
local_iterations = 300
# 旧诊断分组器的束宽；正式 A+B 使用 cp_partition_limit。
partition_beam = 64
# 连续修复的种子角扰动尺度分母；角标准差为 pi/ordering_trials。
ordering_trials = 100
# 旧快照及固定约束预览的兼容种子；新优化任务由后端独立生成随机种子并保存。
random_seed = 42
# 随机种子允许的最大整数，使用无符号 32 位范围以保证浏览器与后端精确传递。
random_seed_max = 4294967295
# 几何验收的浮点误差，单位为毫米。
geometry_tolerance_mm = 0.0001
# 安装面法向与向上轴单位向量的无量纲误差；独立于毫米长度容差。
orientation_tolerance = 0.000001
# 层质量递减偏好的最小差，单位千克；用于构造、择优与报告，不作为合法性红线。
layer_mass_margin_kg = 0.000001
# 左侧栏保留的最近非空文字进度记录条数；资源采样仅更新最新状态，完整输入和最终结果单独持久化。
progress_history_size = 80
# 人工微调旧客户端兼容等待值，单位毫秒；新版每次操作立即校核，不等待停止点击。
refinement_debounce_ms = 0
# 实时校验会话的空闲保留时间，单位秒；保留最新版本以拒绝网络乱序的旧请求。
refinement_session_idle_seconds = 900
# 后端保留的实时校验会话上限；不同浏览器与来源相互隔离。
refinement_session_limit = 128
# 每个微调草稿的命令上限，达到后需保存为新版本。
refinement_command_limit = 1000
# 人工微调的环向按钮默认步长，单位度。
refinement_angle_step_deg = 1.0
# 人工微调的升降按钮默认步长，单位毫米。
refinement_height_step_mm = 10.0
# 人工微调顶部卫星沿全局 X/Y 平移的按钮默认步长，单位毫米。
refinement_translation_step_mm = 10.0
# 人工微调的悬高按钮默认步长，单位毫米。
refinement_suspension_step_mm = 1.0

# 布局安装表“长度、高度、宽度、水平、竖直”五列的固定默认值；末列重量读取方案保存的单星质量。
[layout_optimization.export]
# “长度”列默认值，单位为毫米。
length_mm = 150
# “高度”列默认值，单位为毫米。
height_mm = 450
# “宽度”列默认值，单位为毫米。
width_mm = 150
# “水平”列默认值，单位为毫米。
horizontal_mm = 200
# “竖直”列默认值，单位为毫米。
vertical_mm = 200

# 前端静态服务配置。
[frontend]
# 前端静态服务器监听地址。
host = "127.0.0.1"
# 前端静态服务器监听端口。
port = 11111
# 允许通过反向代理访问前端的域名；只写主机名，本机 localhost 与 IP 由 Vite 默认允许。
allowed_hosts = ["genvis.win"]
# 浏览器调用 API 的基地址；使用 / 保持同源，由前端服务将 /api 转发到上述 backend 地址。
api_base_url = "/"
# 开发启动等待前端资源和后端端口就绪的最长时间，单位为毫秒；超时会回收本次启动的服务。
dev_startup_timeout_ms = 60000
# 开发启动检查后端端口的间隔，单位为毫秒。
dev_poll_interval_ms = 100
# 自动打开浏览器前预热的前端模块 URL；仅预热公共入口与默认模型上传页及其静态依赖。
dev_warmup_paths = ["/frontend/src/main.jsx", "/frontend/src/pages/model-upload/ModelUploadPage.jsx"]
# Vite 开发监听排除的目录，相对于项目根；硬件设置保存不触发页面重载，重启后读取活动值。
dev_watch_ignored_dirs = ["backend", "data", "test-results", "frontend/tauri", "config"]
# 三维渲染后端；auto 优先使用 WebGPU，失败自动回退原有 WebGL，webgl 可用于兼容性排障。
preview_renderer = "auto"
# WebGPU 模块加载与设备初始化的最长等待时间，单位为毫秒；超时直接回退 WebGL。
preview_webgpu_init_timeout_ms = 8000
# 整流罩被自身遮挡的轮廓使用虚线，实划的目标屏幕长度，单位像素。
fairing_hidden_dash_px = 6.0
# 整流罩隐藏轮廓虚线的目标间隔，单位像素；缩放视图时同步换算为模型长度。
fairing_hidden_gap_px = 4.0
# 整流罩边线遮挡射线排除自相交的容差，占罩体包围球半径的比例。
fairing_edge_ray_epsilon_ratio = 0.000001
# 三维交互期间使用的初始画布像素比。
preview_interaction_pixel_ratio = 1.0
# 三维交互期间允许自动降低到的最小画布像素比。
preview_interaction_min_pixel_ratio = 0.65
# 三维视图静止时使用的最大画布像素比。
preview_idle_pixel_ratio_cap = 1.5
# 后台预加载完成后，内存中最多保留的非当前场景模型数量；超过后复用后端已生成资源。
preview_cache_model_limit = 5
# 非当前场景的预览网格数组内存预算，单位字节；大模型超预算时不常驻内存。
preview_cache_max_bytes = 1543503872
# 卫星设置页模型搜索最多保留的最近使用记录数；按最近手动选择排序并去重，0 表示不记录。
model_search_recent_limit = 2
# 前置配置三维画布的最大像素比；越高越清晰，GPU 与显存开销也越大。
pre_config_pixel_ratio_cap = 1.5
# 数据管理三维画布的最大像素比；同时用于内嵌预览和放大窗口。
data_management_pixel_ratio_cap = 1.5
# 数据管理跨页面保留最近一条 GLB 字节的最大体积；超出时仍可预览，但不常驻缓存。
data_management_cache_max_bytes = 234881024
# 三维交互结束后恢复细节预览的等待时间，单位为毫秒。
preview_idle_delay_ms = 180
# 连续慢帧触发降低交互像素比的帧耗时阈值，单位为毫秒。
preview_slow_frame_ms = 20
# 连续快帧触发恢复交互像素比的帧耗时阈值，单位为毫秒。
preview_fast_frame_ms = 14
# 安全包络预览的填充颜色，采用 RGB 十六进制整数。
preview_envelope_color = 0x39d0e9
# 安全包络半透明外壳的不透明度，范围为 0 至 1。
preview_envelope_opacity = 0.22
# 固定卫星世界坐标箭头的默认单次微调距离，单位毫米；用户可在面板临时调整。
fixed_nudge_step_mm = 1.0
# 固定约束中面对安装面顺逆时针旋转的单次角度，固定为四分之一圈；与位置步长、Excel 导出独立。
fixed_mount_rotation_step_deg = 90.0
# 固定卫星六向箭头从中心到箭头末端的目标屏幕长度，单位像素。
fixed_gizmo_size_px = 80
# 固定位置草稿停止变化后发起正式后端校验的等待时间，单位毫秒；拖动期间不发起预览请求。
fixed_validation_debounce_ms = 160
# 后台任务运行期间的前端状态轮询间隔，单位为毫秒。
background_task_running_poll_interval_ms = 1000
# 后台任务空闲或完成后的前端状态轮询间隔，单位为毫秒。
background_task_idle_poll_interval_ms = 5000
# 当前布局方案共享顶点、法向、索引与边线的总预算（字节）；不乘以实例数量。
layout_mesh_geometry_max_bytes = 603979776
# 单型号下载上限（字节），需不大于后端显示资源上限。
layout_mesh_download_max_bytes = 67108864
# 固定约束页预制包络二进制下载上限（字节）；固定页超过后可按实际内存回退旧 JSON 网格。
fixed_display_download_max_bytes = 603979776
# 旧 JSON 网格兜底预留的物理内存，单位字节；用于避免解析和 Worker 派生挤占系统空间。
fixed_legacy_memory_reserve_bytes = 67108864
# 旧 JSON 网格兜底最终几何最多占扣除预留后可用内存的比例。
fixed_legacy_memory_fraction = 0.45
# 旧 JSON 解析与 Worker 派生的合计估算工作集最多占扣除预留后可用内存的比例。
fixed_legacy_worker_fraction = 0.70
# JSON 响应长度折算为下载缓冲、文本和解析对象的保守内存倍数；此空间与几何派生预算分开扣除。
fixed_legacy_json_memory_factor = 12
# Worker 派生几何的保守工作集预算（字节），包括边线构建临时结构估计。
layout_mesh_worker_max_bytes = 1275068416
# 单型号 Worker 的最长处理时间（毫秒），超时终止并释放其内存。
layout_mesh_worker_timeout_ms = 120000
# 布局优化预览中固定卫星的包络填充色，RGB十六进制；与剩余优化卫星区分。
layout_fixed_satellite_color = 0xf6b44b
# 布局优化中非固定卫星及数据管理中固化包络的共用填充色，RGB十六进制。
layout_optimized_satellite_color = 0x39d0e9
# 人工微调中选中卫星的整体填充与轮廓颜色；组合内全部成员共同使用，RGB 十六进制。
layout_refinement_selected_color = 0xffd43b
# 人工微调自动取景时完整卫星与安装筒占画幅的目标比例，范围大于 0 且小于 1，剩余空间用于标签和边距。
layout_refinement_view_fill_ratio = 0.86
# 布局优化与数据管理预览共用的卫星包络填充不透明度，范围为0至1。
layout_satellite_opacity = 0.82

# 模型设置页的体素分辨率与内存建议，仅供展示，不参与资源限制或计算调度。
[frontend.envelope_memory_recommendations]
# 体素分辨率 500 对应的内存最低建议，单位 GB。
500 = 8
# 体素分辨率 1000 对应的内存最低建议，单位 GB。
1000 = 16
# 体素分辨率 1500 对应的内存最低建议，单位 GB。
1500 = 32

# 软件品牌图标；前端直接引用同一组 SVG，桌面和安装包由这些母版生成 ICO。
[branding]
# 标准图标母版，相对于项目根目录；调整路径时需同步前端静态资源引用。
icon_svg = "frontend/assets/branding/sat-layout-opt.svg"
# 小尺寸母版；保持外轮廓和配色，仅扩大星体分缝以适配浏览器标签和任务栏。
small_icon_svg = "frontend/assets/branding/sat-layout-opt-small.svg"
# 使用小尺寸母版的最大图标边长，单位为像素。
small_icon_max_size = 32
# Windows ICO 包含的方形帧边长，单位为像素；覆盖常见显示缩放与资源管理器尺寸。
windows_icon_sizes = [16, 20, 24, 32, 40, 48, 64, 96, 128, 256]

# 桌面安装版配置；开发启动仍使用上面的固定端口，桌面版使用本机动态端口避免冲突。
[desktop]
# 安装后的程序名称。
title = "卫星配载工作台"
# 桌面启动的默认页面。
entry_path = "/frontend/model-upload"
# 仅供历史 Electron 入口使用；当前 Tauri 安装版以程序根目录为数据路径基准，不读取此用户目录。
user_data_dir = "SatLayoutOpt"
# 桌面状态相对数据基准的目录，存放 WebView 资料、配置备份和启动状态；安装版位于安装目录内。
state_dir = "data/desktop-state"
# 窗口初始宽度，单位为像素。
width = 1440
# 窗口初始高度，单位为像素。
height = 900
# 窗口最小宽度，单位为像素。
min_width = 960
# 窗口最小高度，单位为像素。
min_height = 640
# 原生窗口与 WebView 绘制前的统一底色，按 RGBA 字节配置；不透明底色与默认亮色页面一致，减少缩放时黑底闪烁。
background_color = [242, 246, 250, 255]
# 后端启动等待时间，单位为毫秒。
startup_timeout_ms = 90000
# 退出时等待后台释放资源的时间，单位为毫秒。
shutdown_timeout_ms = 8000
# 检测桌面退出通知和父进程管道断开的间隔，单位为毫秒。
control_poll_interval_ms = 200

# Tauri 桌面壳；Rust 后端管理业务与任务，独立 Python 进程负责几何和数值计算。
[desktop.tauri]
# Windows 应用标识，用于窗口与单实例管理。
identifier = "com.satlayoutopt.desktop"
# 开发桌面数据根目录，与浏览器开发数据及已安装 Electron 数据隔离。
data_dir = "data/desktop/tauri"
# Cargo 产物和 Tauri 派生配置目录；仅保存可重新生成的构建文件。
build_dir = "data/build/tauri"
# Rustup 与 Cargo 的相对安装目录，均相对于指定 Conda 环境。
rustup_dir = "Tools/rustup"
cargo_dir = "Tools/cargo"
# Windows C++ 编译工具目录，相对于指定 Conda 环境。
msvc_dir = "Tools/VSBuildTools"
# Rust 首次编译并行任务数，限制构建峰值内存。
build_jobs = 4
# 本机代理建立上游连接的时限，单位毫秒；计算响应本身不设短超时。
connect_timeout_ms = 2000
# 本机页面的内容安全策略；资源和 API 同源，允许 Three.js 的 Blob 与内联样式。
csp = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Windows 安装包构建参数，构建产物和下载缓存均在被 Git 忽略的 data 目录。
[packaging]
# 安装包版本号。
version = "0.4.0"
# 构建时必须使用的项目 Conda 环境。
python_environment = "D:/Conda_envs/payload-opt"
# 一键打包入口调用的 Conda 可执行文件；启动路径使用正斜杠。
conda_executable = "D:/soft/anaconda/Scripts/conda.exe"
# 安装包与可直接启动目录的输出位置，相对于项目根目录。
output_dir = "data/releases"
# WebView2 下载与解压缓存，必须位于项目 data/build 的独立子目录；有效缓存复用，失效和旧版本先清理再生成。
cache_dir = "data/build/installer-cache"
# Inno Setup 编译器位置，支持环境变量展开。
inno_compiler = "%LOCALAPPDATA%/Programs/Inno Setup 6/ISCC.exe"
# Nuitka 缓存目录，必须位于项目 data/build 的独立子目录；仅保留当前输入的有效缓存，C 源码和报告不分发。
nuitka_build_dir = "data/build/nuitka"
# Nuitka 并行 C 编译任务数量，按构建机器内存调整。
nuitka_jobs = 4
# Windows C 编译器选择：auto、mingw64 或 msvc。
nuitka_compiler = "mingw64"
# 允许 Nuitka 下载官方提供的编译器及依赖分析工具；Python 包仍只安装在指定 Conda 环境。
nuitka_allow_downloads = true
# 整条打包流程的互斥锁目录；必须位于项目 data/build 的独立子目录。
pipeline_dir = "data/build/packaging"
# 无新工具输出时，在命令窗口刷新当前步骤和已用时间的间隔，单位秒；打包输出不写阶段日志。
progress_interval_seconds = 5
# 单个编译命令最长运行时间，单位秒；错误直接显示在命令窗口。
build_timeout_seconds = 21600
# 单个安装或业务验收命令最长运行时间，单位秒。
validation_timeout_seconds = 1800
# Windows 10/11 自带的系统 DLL；除此以外的缺失库必须从包内或指定 Conda 环境解析。
native_system_dlls = ["advapi32.dll", "bcrypt.dll", "bcryptprimitives.dll", "crypt32.dll", "d3d11.dll", "dbghelp.dll", "dxgi.dll", "gdi32.dll", "iphlpapi.dll", "kernel32.dll", "msvcrt.dll", "ntdll.dll", "ole32.dll", "oleacc.dll", "oleaut32.dll", "opengl32.dll", "pdh.dll", "powrprof.dll", "propsys.dll", "psapi.dll", "rpcrt4.dll", "secur32.dll", "shell32.dll", "shlwapi.dll", "urlmon.dll", "user32.dll", "userenv.dll", "version.dll", "wevtapi.dll", "winmm.dll", "ws2_32.dll", "wsock32.dll"]
# 通过运行时加载且未出现在 PE 导入表中的额外 DLL 名称；wheel 自带动态库另行保留。
native_dynamic_dlls = ["vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll"]
# 不分发未使用且依赖外部授权或独立安装的 CasADi 可选插件；核心 CAD/布局不调用这些求解器。
# 若未来启用对应能力，先安装其运行库并移除对应排除项；其他包内 PE 引用排除项时构建会失败。
native_excluded_dlls = ["casadi/libcasadi_conic_xpress.dll", "casadi/libcasadi_nlpsol_knitro.dll", "casadi/libcasadi_linsol_ma27.dll", "casadi/libcasadi_nlpsol_ccopt.dll", "casadi/libcasadi_nlpsol_madnlp.dll", "casadi/libcasadi_nlpsol_snopt.dll", "casadi/libcasadi_nlpsol_worhp.dll", "casadi/libmatlab_ipc.dll"]
# 随离线安装包分发的 WebView2 固定运行时目录，相对于安装根目录。
webview2_dir = "runtime/webview2"
# 固定运行时版本；更新此项时同步 URL、摘要并重新验收原生窗口。
webview2_version = "154.0.4258.62"
# 微软官方固定版本 x64 CAB 地址；只在构建时下载，安装和使用均不联网。
webview2_download_url = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b92cd7d9-6976-4f34-9708-47e80937c287/Microsoft.WebView2.FixedVersionRuntime.154.0.4258.62.x64.cab"
# 官方 CAB 的固定 SHA256；首次获取另核验微软 Authenticode 签名，之后按此摘要校验缓存。
webview2_sha256 = "e8f55a4bde27c7f82512402b56a58539b5ec8928be4e500e077b6f66c9ef4668"
